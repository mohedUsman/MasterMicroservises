
server:
  port: 8080

#here I need to give the same name as the name inside the configServer
spring:
  application:
    name: "accounts"
  #when ever the accounts microservice starts, it will look for prod profiles
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:test
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  #connecting to the config server endpoints
  #the name of the config server is optional, if not provided it will look for the default config server
  config:
    import: "optional:configserver:http://localhost:8071"

  #for rabbitmq connection for config client
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


#to expose management endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
